# Produccion: sin base de datos; la autenticacion la hace api_usuarios.
services:
  apigateway:
    build:
      context: .
      dockerfile: Dockerfile

    # Modo host: "localhost" dentro del contenedor es la maquina anfitriona,
    # por lo que los defaults de application.properties funcionan en local.
    network_mode: host

    env_file:
      - .env
    environment:
      SERVER_PORT: 8888

      # Las URLs de microservicios NO se fijan aqui: se usan los defaults de
      # application.properties o los valores (comentados) del .env.

    restart: unless-stopped
