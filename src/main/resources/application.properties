
# Se busca el .env tanto en la raiz del proyecto como un nivel arriba (ej: ejecutando desde target/)
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties],optional:file:./api_usuarios/.env[.properties]

spring.application.name=ApiGateWay
server.port=8888

#Config base de datos
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:usuarios_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:hola123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# El dialecto se declara explicitamente porque se desactiva el acceso a metadata JDBC
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# El gateway no es dueno del esquema: lo crea el microservicio de usuarios
spring.jpa.hibernate.ddl-auto=none
# Arranque tolerante: si la BD de usuarios no esta levantada, la app igual inicia
spring.datasource.hikari.initialization-fail-timeout=-1
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false
spring.jpa.show-sql=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
jwt.secret=clave_super_segura_de_mas_de_64_bytes_de_longitud_esto_es_necesario_para_HS512

#Conexion a microservicios.
# Si no hay valores en el entorno se usa localhost con el puerto indicado.
# Ojo: una variable VACIA (USUARIOS_API_URL=) NO aplica el default; hay que
# dejarla comentada o no definirla en el .env.
microservicios.usuarios.url=${USUARIOS_API_URL:http://localhost:${USUARIOS_API_PORT:8080}}
microservicios.inventario.url=${INVENTARIO_API_URL:http://localhost:${INVENTARIO_API_PORT:8083}}
microservicios.compras.url=${COMPRAS_API_URL:http://localhost:${COMPRAS_API_PORT:8081}}
microservicios.transporte.url=${TRANSPORTE_API_URL:http://localhost:${TRANSPORTE_API_PORT:8084}}

#---Conexion a los endpoints de los microservicios---

#usuarios api endpotins
services.usuarios.base-url=${microservicios.usuarios.url}
services.usuarios.base-path=/api/usuariosApi

services.regiones.base-url=${microservicios.usuarios.url}
services.regiones.base-path=/api/regionesApi

services.comunas.base-url=${microservicios.usuarios.url}
services.comunas.base-path=/api/comunasApi

#inventario api endpoints
services.autor.base-url=${microservicios.inventario.url}
services.autor.base-path=/api/autorHistApi

services.genero.base-url=${microservicios.inventario.url}
services.genero.base-path=/api/generoHistApi

services.historieta.base-url=${microservicios.inventario.url}
services.historieta.base-path=/api/historietaApi

services.serie.base-url=${microservicios.inventario.url}
services.serie.base-path=/api/serieHistApi

services.tipo.base-url=${microservicios.inventario.url}
services.tipo.base-path=/api/tipoHistApi

#compras api endpoints
services.boletas.base-url=${microservicios.compras.url}
services.boletas.base-path=/api/boletasApi

services.carritos.base-url=${microservicios.compras.url}
services.carritos.base-path=/api/carritosApi

services.historialCompras.base-url=${microservicios.compras.url}
services.historialCompras.base-path=/api/historialComprasApi

services.listaDeseos.base-url=${microservicios.compras.url}
services.listaDeseos.base-path=/api/ListaDeseosApi

services.mediosPago.base-url=${microservicios.compras.url}
services.mediosPago.base-path=/api/mediosPagoApi

services.productoCart.base-url=${microservicios.compras.url}
services.productoCart.base-path=/api/ProductoCartApi

services.productoListaDeseos.base-url=${microservicios.compras.url}
services.productoListaDeseos.base-path=/api/productoListaDeseosApi

#transporte api endpoints
services.empresaTransporte.base-url=${microservicios.transporte.url}
services.empresaTransporte.base-path=/api/EmpresaTransporteApi

services.pedidos.base-url=${microservicios.transporte.url}
services.pedidos.base-path=/api/PedidosApi

services.transportistas.base-url=${microservicios.transporte.url}
services.transportistas.base-path=/api/TransportistasApi

server.compression.enabled=false
